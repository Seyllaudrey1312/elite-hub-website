<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Elite Hub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../Favicon.png">
</head>
<body class="bg-gray-100">
    <div class="lg:flex lg:h-screen lg:overflow-hidden">
        <div id="admin-sidebar"></div>

        <main class="flex-1 overflow-y-auto lg:pt-0 pt-14">
            <div class="p-4 lg:p-8">
                <div class="mb-6 lg:mb-8">
                    <h2 class="text-2xl lg:text-3xl font-bold text-gray-800 mb-2">Student Management</h2>
                    <p class="text-gray-600">View and manage all enrolled students</p>
                </div>

                <div class="bg-white rounded-lg shadow p-4 lg:p-6 mb-6 lg:mb-8">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Search by Name or Email</label>
                            <input type="text" id="search-input" placeholder="Type to search..." onkeyup="filterStudents()" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Filter by Form</label>
                            <select id="form-filter" onchange="filterStudents()" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none">
                                <option value="">All Forms</option>
                                <option value="1">Form 1</option>
                                <option value="2">Form 2</option>
                                <option value="3">Form 3</option>
                                <option value="4">Form 4</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Filter by Status</label>
                            <select id="status-filter" onchange="filterStudents()" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none">
                                <option value="">All Status</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    <div class="bg-white rounded-lg shadow p-6"><p class="text-sm text-gray-600 mb-2">Total Students</p><p class="text-3xl font-bold text-blue-600" id="total-students">0</p></div>
                    <div class="bg-white rounded-lg shadow p-6"><p class="text-sm text-gray-600 mb-2">Active Students</p><p class="text-3xl font-bold text-green-600" id="active-students">0</p></div>
                    <div class="bg-white rounded-lg shadow p-6"><p class="text-sm text-gray-600 mb-2">Avg. Completion Rate</p><p class="text-3xl font-bold text-purple-600" id="avg-completion">0%</p></div>
                    <div class="bg-white rounded-lg shadow p-6"><p class="text-sm text-gray-600 mb-2">Avg. Quiz Score</p><p class="text-3xl font-bold text-orange-600" id="avg-score">0%</p></div>
                </div>

                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-bold text-gray-800">Students List</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-100 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-3 text-left text-sm font-bold text-gray-700">Name</th>
                                    <th class="px-6 py-3 text-left text-sm font-bold text-gray-700">Email</th>
                                    <th class="px-6 py-3 text-left text-sm font-bold text-gray-700">Form</th>
                                    <th class="px-6 py-3 text-left text-sm font-bold text-gray-700">Subjects</th>
                                    <th class="px-6 py-3 text-left text-sm font-bold text-gray-700">Quizzes Taken</th>
                                    <th class="px-6 py-3 text-left text-sm font-bold text-gray-700">Avg. Score</th>
                                    <th class="px-6 py-3 text-left text-sm font-bold text-gray-700">Status</th>
                                    <th class="px-6 py-3 text-left text-sm font-bold text-gray-700">Action</th>
                                </tr>
                            </thead>
                            <tbody id="students-tbody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="empty-state" class="bg-white rounded-lg shadow p-12 text-center hidden">
                    <p class="text-gray-600 text-lg">No students found</p>
                </div>
            </div>
        </main>
    </div>

    <div id="detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 max-h-96 overflow-y-auto">
            <div class="px-6 py-4 border-b border-gray-200 sticky top-0 bg-white">
                <div class="flex justify-between items-center">
                    <h3 class="text-xl font-bold text-gray-800">Student Details</h3>
                    <button onclick="closeDetailModal()" class="text-gray-600 hover:text-gray-800 text-2xl">&times;</button>
                </div>
            </div>
            <div id="detail-content" class="px-6 py-4"></div>
            <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 text-right">
                <button onclick="closeDetailModal()" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg font-medium">Close</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        initPage('admin', 'users');

        let allStudents = [], filteredStudents = [];

        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            checkAdminAuth();
            await loadStudents();
        }

        async function loadStudents() {
            try {
                allStudents = await getAllStudents();
                filteredStudents = [...allStudents];
                updateStats();
                displayStudents();
            } catch (error) {
                console.error('Error loading students:', error);
                allStudents = []; filteredStudents = [];
                updateStats(); displayStudents();
            }
        }

        function updateStats() {
            const active = allStudents.filter(s => s.status === 'active').length;
            let totalComp = 0, compCount = 0, totalAvg = 0, scoreCount = 0;
            allStudents.forEach(s => {
                if (s.quizResults?.length) {
                    compCount++;
                    const avg = s.quizResults.reduce((sum, r) => sum + r.percentage, 0) / s.quizResults.length;
                    totalAvg += avg; scoreCount++;
                    totalComp += Math.min(s.quizResults.length * 20, 100);
                }
            });
            document.getElementById('total-students').textContent   = allStudents.length;
            document.getElementById('active-students').textContent  = active;
            document.getElementById('avg-completion').textContent   = compCount > 0 ? Math.round(totalComp / compCount) + '%' : '0%';
            document.getElementById('avg-score').textContent        = scoreCount > 0 ? Math.round(totalAvg / scoreCount) + '%' : '0%';
        }

        function displayStudents() {
            const tbody = document.getElementById('students-tbody');
            const emptyState = document.getElementById('empty-state');
            if (!filteredStudents.length) { tbody.innerHTML = ''; emptyState.classList.remove('hidden'); return; }
            emptyState.classList.add('hidden');
            tbody.innerHTML = '';
            filteredStudents.forEach(student => {
                const quizzesTaken = student.quizResults?.length || 0;
                const avgScore = quizzesTaken > 0 ? Math.round(student.quizResults.reduce((s, r) => s + r.percentage, 0) / quizzesTaken) : 0;
                const subjects = (student.subjects || []).map(s => typeof s === 'object' ? s.name : s).join(', ');
                const statusColor = student.status === 'active' ? 'text-green-600' : 'text-red-600';
                const statusText  = student.status === 'active' ? '✅ Active' : '⏸️ Inactive';
                const row = document.createElement('tr');
                row.className = 'border-b border-gray-200 hover:bg-gray-50';
                row.innerHTML = `<td class="px-6 py-4 font-medium text-gray-800">${student.name||'N/A'}</td><td class="px-6 py-4 text-gray-700">${student.email||'N/A'}</td><td class="px-6 py-4 text-gray-700">Form ${student.form||'N/A'}</td><td class="px-6 py-4 text-gray-700">${subjects}</td><td class="px-6 py-4 font-bold text-gray-800">${quizzesTaken}</td><td class="px-6 py-4 font-bold text-blue-600">${avgScore}%</td><td class="px-6 py-4 ${statusColor} font-bold">${statusText}</td><td class="px-6 py-4"><button onclick="viewStudentDetail('${student._id}')" class="text-blue-600 hover:text-blue-800 font-medium">View</button></td>`;
                tbody.appendChild(row);
            });
        }

        function filterStudents() {
            const term   = document.getElementById('search-input').value.toLowerCase();
            const form   = document.getElementById('form-filter').value;
            const status = document.getElementById('status-filter').value;
            filteredStudents = allStudents.filter(s =>
                ((s.name||'').toLowerCase().includes(term) || (s.email||'').toLowerCase().includes(term)) &&
                (!form   || s.form   === form) &&
                (!status || s.status === status)
            );
            displayStudents();
        }

        function viewStudentDetail(id) {
            const s = allStudents.find(x => x._id === id);
            if (!s) return;
            const quizzesTaken = s.quizResults?.length || 0;
            const avgScore = quizzesTaken > 0 ? Math.round(s.quizResults.reduce((sum, r) => sum + r.percentage, 0) / quizzesTaken) : 0;
            const subjects = (s.subjects || []).map(x => typeof x === 'object' ? x.name : x).join(', ');
            document.getElementById('detail-content').innerHTML = `
                <div class="space-y-4">
                    <div><p class="text-sm text-gray-600">Name</p><p class="text-lg font-bold text-gray-800">${s.name}</p></div>
                    <div><p class="text-sm text-gray-600">Email</p><p class="text-lg text-gray-800">${s.email}</p></div>
                    <div><p class="text-sm text-gray-600">Form</p><p class="text-lg text-gray-800">Form ${s.form}</p></div>
                    <div><p class="text-sm text-gray-600">Subjects</p><p class="text-lg text-gray-800">${subjects}</p></div>
                    <div><p class="text-sm text-gray-600">Quizzes Taken</p><p class="text-lg font-bold text-gray-800">${quizzesTaken}</p></div>
                    <div><p class="text-sm text-gray-600">Average Score</p><p class="text-lg font-bold text-blue-600">${avgScore}%</p></div>
                </div>`;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeDetailModal() { document.getElementById('detail-modal').classList.add('hidden'); }

        function checkAdminAuth() {
            if (!localStorage.getItem('isAdmin') || !localStorage.getItem('adminToken')) window.location.href = 'admin-login.html';
        }

        function adminLogout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('isAdmin');
            window.location.href = 'admin-login.html';
        }
    </script>
    <script src="../assets/js/pwa-register.js"></script>
</body>
</html>
