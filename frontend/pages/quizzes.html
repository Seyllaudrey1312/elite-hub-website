<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes & Assignments - Elite Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../Favicon.png">
</head>
<body class="bg-gray-50">
    <div id="main-nav"></div>

    <!-- Page Header -->
    <section class="bg-gradient-to-r from-blue-900 to-green-700 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl font-bold">Quizzes & Assignments</h1>
            <p class="text-lg text-gray-100 mt-2">Practice and test your knowledge</p>
        </div>
    </section>

    <section class="py-6 bg-white sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-4 flex-wrap">
            <button id="quizzesTab" class="tab-button active px-6 py-3 border-b-2 border-blue-900 text-blue-900 font-bold">Quizzes</button>
            <button id="assignmentsTab" class="tab-button px-6 py-3 border-b-2 border-transparent text-gray-600 hover:text-blue-900">Assignments</button>
            <div class="flex-1"></div>
            <input id="quizSearch" type="text" placeholder="Search quizzes..." class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
            <select id="quizSubjectFilter" class="px-3 py-2 border border-gray-300 rounded-lg">
                <option value="All">All Subjects</option>
            </select>
            <select id="quizFormFilter" class="px-3 py-2 border border-gray-300 rounded-lg">
                <option value="All">All Forms</option>
            </select>
        </div>
    </section>

    <!-- Quizzes -->
    <section id="quizzes-section" class="py-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="quizzesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="quizzesEmpty" class="hidden text-center py-10 text-gray-500"></div>
            <div id="quizzesError" class="hidden text-center py-10 text-red-600"></div>
        </div>
    </section>

    <!-- Assignments -->
    <section id="assignments-section" class="py-10 hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="assignmentsList" class="space-y-6"></div>
            <div id="assignmentsEmpty" class="hidden text-center py-10 text-gray-500"></div>
            <div id="assignmentsError" class="hidden text-center py-10 text-red-600"></div>
        </div>
    </section>

    <!-- Assignment Submission Modal -->
    <div id="assignmentModal" class="cs-modal-backdrop hidden">
        <div class="cs-modal max-w-xl w-full">
            <span class="cs-emoji">📤</span>
            <h3 id="assignmentModalTitle">Submit Assignment</h3>
            <input type="file" id="assignmentFile" accept=".pdf,.doc,.docx,image/*" class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-3">
            <textarea id="assignmentComments" rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-2" placeholder="Add comments (optional)"></textarea>
            <p id="commentCount" class="text-xs text-gray-500 mb-2 text-left">0 / 500</p>
            <button id="assignmentSubmitBtn" class="btn-primary">Submit</button>
            <button class="btn-close" id="assignmentCloseBtn">Cancel</button>
        </div>
    </div>

    <div id="main-footer"></div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/pwa-register.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>initPage('student', 'quizzes');</script>
    <script>
        let allQuizzes = [];
        let myResults = [];
        let allAssignments = [];
        let currentAssignmentId = null;

        document.addEventListener('DOMContentLoaded', () => {
            bindTabs();
            bindFilters();
            bindAssignmentModal();
            fetchQuizzes();
            fetchAssignments();
            if (window.location.hash === '#assignments') showAssignments();
        });

        function bindTabs() {
            const qTab = document.getElementById('quizzesTab');
            const aTab = document.getElementById('assignmentsTab');
            qTab.onclick = () => { showQuizzes(); window.location.hash=''; };
            aTab.onclick = () => { showAssignments(); window.location.hash='#assignments'; };
        }

        function showQuizzes() {
            document.getElementById('quizzes-section').classList.remove('hidden');
            document.getElementById('assignments-section').classList.add('hidden');
            document.getElementById('quizzesTab').classList.add('border-blue-900','text-blue-900','font-bold');
            document.getElementById('assignmentsTab').classList.remove('border-blue-900','text-blue-900','font-bold');
        }
        function showAssignments() {
            document.getElementById('assignments-section').classList.remove('hidden');
            document.getElementById('quizzes-section').classList.add('hidden');
            document.getElementById('assignmentsTab').classList.add('border-blue-900','text-blue-900','font-bold');
            document.getElementById('quizzesTab').classList.remove('border-blue-900','text-blue-900','font-bold');
        }

        function bindFilters() {
            document.getElementById('quizSearch').addEventListener('input', applyQuizFilters);
            document.getElementById('quizSubjectFilter').addEventListener('change', applyQuizFilters);
            document.getElementById('quizFormFilter').addEventListener('change', applyQuizFilters);
        }

        async function fetchQuizzes() {
            renderQuizSkeletons();
            try {
                const quizzes = await getAllQuizzes();
                allQuizzes = Array.isArray(quizzes) ? quizzes : (quizzes.quizzes || []);
                try {
                    myResults = await getQuizResultsForMe();
                } catch (e) { myResults = []; }
                populateQuizFilters();
                if (!allQuizzes.length) {
                    document.getElementById('quizzesEmpty').textContent = 'No quizzes available yet. Check back soon.';
                    document.getElementById('quizzesEmpty').classList.remove('hidden');
                    return;
                }
                applyQuizFilters();
            } catch (err) {
                const el = document.getElementById('quizzesError');
                el.innerHTML = `${err.message || 'Failed to load quizzes'} <br><button class="toast-action" onclick="fetchQuizzes()">Retry</button>`;
                el.classList.remove('hidden');
            }
        }

        function renderQuizSkeletons() {
            const list = document.getElementById('quizzesList');
            list.innerHTML = Array.from({length:3}).map(()=>`
                <div class="bg-white rounded-lg shadow p-6 animate-pulse">
                    <div class="h-4 bg-gray-200 rounded w-2/3 mb-3"></div>
                    <div class="h-3 bg-gray-200 rounded w-1/3 mb-2"></div>
                    <div class="h-3 bg-gray-200 rounded w-1/4 mb-4"></div>
                    <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
                    <div class="h-3 bg-gray-200 rounded w-5/6 mb-4"></div>
                    <div class="h-8 bg-gray-200 rounded"></div>
                </div>
            `).join('');
        }

        function populateQuizFilters() {
            const subjectSelect = document.getElementById('quizSubjectFilter');
            const formSelect = document.getElementById('quizFormFilter');
            const subjects = Array.from(new Set(allQuizzes.map(q => q.subject).filter(Boolean))).sort();
            subjects.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                subjectSelect.appendChild(opt);
            });
            const forms = Array.from(new Set(allQuizzes.map(q => q.form).filter(Boolean))).sort();
            forms.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                formSelect.appendChild(opt);
            });
        }

        function applyQuizFilters() {
            const term = document.getElementById('quizSearch').value.toLowerCase();
            const subj = document.getElementById('quizSubjectFilter').value;
            const form = document.getElementById('quizFormFilter').value;
            const filtered = allQuizzes.filter(q => {
                const sm = subj === 'All' || (q.subject || '').toLowerCase() === subj.toLowerCase();
                const fm = form === 'All' || (q.form || '').toLowerCase() === form.toLowerCase();
                const tm = !term || (q.title || '').toLowerCase().includes(term) || (q.topic || '').toLowerCase().includes(term);
                return sm && fm && tm;
            });
            renderQuizzes(filtered);
        }

        function renderQuizzes(list) {
            const container = document.getElementById('quizzesList');
            if (!list.length) {
                container.innerHTML = '';
                document.getElementById('quizzesEmpty').textContent = 'No quizzes found for the selected filters.';
                document.getElementById('quizzesEmpty').classList.remove('hidden');
                return;
            }
            document.getElementById('quizzesEmpty').classList.add('hidden');
            container.innerHTML = list.map(renderQuizCard).join('');
        }

        function renderQuizCard(q) {
            const completed = myResults.find(r => r.quizId === q._id);
            const statusBadge = completed ? '<span class="badge badge-success">Completed</span>' : '<span class="badge badge-warning">Not Started</span>';
            const isPremium = !!q.isPremium;
            const button = isPremium
                ? `<button class="bg-blue-900 text-white px-4 py-2 rounded flex items-center gap-2" data-pro="true">🔒 Pro</button>`
                : `<button class="bg-blue-900 text-white px-4 py-2 rounded hover:bg-blue-800 transition" onclick="startQuiz('${q._id}', ${!!completed})">${completed ? 'Retake Quiz' : 'Start Quiz'}</button>`;
            return `
                <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition ${isPremium ? 'locked-overlay' : ''}">
                    <div class="flex items-start justify-between mb-3">
                        <h3 class="text-lg font-bold text-blue-900 flex items-center gap-2">${isPremium ? '<span class="pro-badge">Pro</span>' : ''}${q.title || 'Untitled Quiz'}</h3>
                        <span class="bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full">${q.form || 'All'}</span>
                    </div>
                    <div class="flex flex-wrap gap-2 text-xs mb-2">
                        <span class="badge badge-primary">${q.subject || 'Subject'}</span>
                        <span class="badge badge-warning">${q.topic || 'Topic'}</span>
                    </div>
                    <p class="text-sm text-gray-600 mb-1">Questions: ${q.questions?.length || q.questionCount || 0}</p>
                    <p class="text-sm text-gray-600 mb-2">Time limit: ${q.timeLimit || q.timeLimitMinutes || 0} mins</p>
                    ${statusBadge}
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xs text-gray-500">${completed ? 'Completed' : 'Ready'}</span>
                        ${button}
                    </div>
                </div>
            `;
        }

        function startQuiz(id, completed) {
            window.location.href = `take-quiz.html?id=${id}`;
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('[data-pro="true"]')) {
                showComingSoon('This is a Pro quiz. Advanced quiz sets with detailed feedback and performance tracking are coming soon as part of our paid plans. You will be notified when Premium becomes available.', 'Pro Quiz', '🔒', 'premium_quiz');
            }
        });

        async function fetchAssignments() {
            renderAssignmentSkeletons();
            try {
                const data = await getAllAssignments();
                allAssignments = Array.isArray(data) ? data : (data.assignments || []);
                if (!allAssignments.length) {
                    const empty = document.getElementById('assignmentsEmpty');
                    empty.textContent = 'No assignments available yet. Check back soon.';
                    empty.classList.remove('hidden');
                    return;
                }
                renderAssignments(allAssignments);
            } catch (err) {
                const el = document.getElementById('assignmentsError');
                el.innerHTML = `${err.message || 'Failed to load assignments'} <br><button class="toast-action" onclick="fetchAssignments()">Retry</button>`;
                el.classList.remove('hidden');
            }
        }

        function renderAssignmentSkeletons() {
            const list = document.getElementById('assignmentsList');
            list.innerHTML = Array.from({length:3}).map(()=>`
                <div class="bg-white rounded-lg shadow p-6 animate-pulse">
                    <div class="h-4 bg-gray-200 w-2/3 rounded mb-3"></div>
                    <div class="h-3 bg-gray-200 w-1/3 rounded mb-2"></div>
                    <div class="h-3 bg-gray-200 w-full rounded mb-2"></div>
                    <div class="h-8 bg-gray-200 rounded mt-3"></div>
                </div>
            `).join('');
        }

        function renderAssignments(list) {
            const container = document.getElementById('assignmentsList');
            container.innerHTML = list.map(renderAssignmentCard).join('');
        }

        function renderAssignmentCard(a) {
            const dueDate = a.dueDate ? new Date(a.dueDate) : null;
            const now = new Date();
            const daysLeft = dueDate ? Math.ceil((dueDate - now) / 86400000) : null;
            let badge = '';
            if (daysLeft === null) {
                badge = '<span class="badge badge-warning">No due date</span>';
            } else if (daysLeft < 0) {
                badge = '<span class="badge badge-danger">Overdue</span>';
            } else if (daysLeft < 3) {
                badge = '<span class="badge badge-danger">' + daysLeft + ' days left</span>';
            } else if (daysLeft < 7) {
                badge = '<span class="badge badge-warning">' + daysLeft + ' days left</span>';
            } else {
                badge = '<span class="badge badge-success">' + daysLeft + ' days left</span>';
            }

            return `
                <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition border-l-4 border-blue-900">
                    <div class="flex items-start justify-between mb-3">
                        <div>
                            <h3 class="text-xl font-bold text-blue-900 mb-1">${a.title || 'Assignment'}</h3>
                            <div class="flex flex-wrap gap-2 text-xs mb-2">
                                <span class="badge badge-primary">${a.subject || 'Subject'}</span>
                                <span class="badge badge-warning">${a.form || 'Form'}</span>
                            </div>
                            <p class="text-gray-600 mb-2">${a.description || ''}</p>
                            <p class="text-xs text-gray-500">Due: ${dueDate ? dueDate.toDateString() : 'N/A'}</p>
                        </div>
                        ${badge}
                    </div>
                    <div class="flex justify-end">
                        <button class="bg-blue-900 text-white px-4 py-2 rounded hover:bg-blue-800 transition" onclick="openAssignmentModal('${a._id}', '${(a.title || '').replace(/'/g,'\\'')}')">Submit Assignment</button>
                    </div>
                </div>
            `;
        }

        function bindAssignmentModal() {
            document.getElementById('assignmentCloseBtn').onclick = closeAssignmentModal;
            document.getElementById('assignmentComments').addEventListener('input', (e) => {
                const val = e.target.value.slice(0,500);
                e.target.value = val;
                document.getElementById('commentCount').textContent = `${val.length} / 500`;
            });
            document.getElementById('assignmentSubmitBtn').onclick = submitAssignment;
        }

        function openAssignmentModal(id, title) {
            currentAssignmentId = id;
            document.getElementById('assignmentModalTitle').textContent = `Submit: ${title || 'Assignment'}`;
            document.getElementById('assignmentModal').classList.remove('hidden');
        }
        function closeAssignmentModal() {
            currentAssignmentId = null;
            document.getElementById('assignmentModal').classList.add('hidden');
            document.getElementById('assignmentFile').value = '';
            document.getElementById('assignmentComments').value = '';
            document.getElementById('commentCount').textContent = '0 / 500';
            const btn = document.getElementById('assignmentSubmitBtn');
            btn.disabled = false;
            btn.textContent = 'Submit';
        }

        async function submitAssignment() {
            if (!currentAssignmentId) return;
            const btn = document.getElementById('assignmentSubmitBtn');
            const file = document.getElementById('assignmentFile').files[0];
            const comments = document.getElementById('assignmentComments').value;
            if (file && file.size > 10 * 1024 * 1024) {
                showNotification('File must be under 10MB', 'error');
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Uploading...';
            try {
                await submitAssignmentFile(currentAssignmentId, file, comments);
                showNotification('Assignment submitted', 'success');
                closeAssignmentModal();
                markAssignmentSubmitted(currentAssignmentId);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Submit';
                showNotification(err.message || 'Submission failed', 'error');
            }
        }

        function markAssignmentSubmitted(id) {
            const list = document.getElementById('assignmentsList');
            const cards = list.querySelectorAll('.bg-white');
            cards.forEach(card => {
                if (card.innerHTML.includes(id)) return;
            });
            // simple re-render
            renderAssignments(allAssignments);
        }
    </script>
</body>
</html>
