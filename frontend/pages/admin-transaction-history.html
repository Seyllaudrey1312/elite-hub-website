<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../Favicon.png">
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-8">
        <h1 class="text-3xl font-bold text-blue-900 mb-4">Transaction History</h1>
        <div class="bg-white rounded-lg shadow border border-gray-200 p-6">
            <div class="cs-emoji text-center">📜</div>
            <p class="text-center text-gray-600 mb-4">Transactions will appear here once the payment system is live.</p>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm text-left">
                    <thead class="bg-gray-100 text-gray-700">
                        <tr>
                            <th class="px-4 py-2">Student Name</th>
                            <th class="px-4 py-2">Plan</th>
                            <th class="px-4 py-2">Amount</th>
                            <th class="px-4 py-2">Date</th>
                            <th class="px-4 py-2">Method</th>
                            <th class="px-4 py-2">Status</th>
                        </tr>
                    </thead>
                </table>
            </div>
            <div class="coming-soon-banner mt-4">
                <span>Payments are disabled — this table will populate once live.</span>
                <button onclick="showComingSoon()">Notify Me</button>
            </div>
        </div>
    </div>
    <script src="../assets/js/main.js"></script>
</body>
</html>
