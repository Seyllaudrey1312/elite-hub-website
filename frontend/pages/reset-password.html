<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Elite Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../Favicon.png">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md bg-white shadow-xl rounded-xl p-8">
            <h1 class="text-3xl font-bold text-center text-blue-900 mb-2">Choose a new password</h1>
            <p class="text-center text-gray-600 mb-6">Your reset link is valid for 60 minutes.</p>
            <form id="resetForm" class="space-y-4">
                <div class="floating-field">
                    <label for="rp-password">New password</label>
                    <input id="rp-password" type="password" minlength="6" required class="w-full px-4 py-3 border border-gray-300 rounded-lg" placeholder=" ">
                </div>
                <div class="floating-field">
                    <label for="rp-confirm">Confirm new password</label>
                    <input id="rp-confirm" type="password" minlength="6" required class="w-full px-4 py-3 border border-gray-300 rounded-lg" placeholder=" ">
                </div>
                <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3 rounded-lg hover:bg-blue-800 transition">Update password</button>
            </form>
            <p class="text-center text-gray-600 mt-6 text-sm">
                Back to <a href="./login.html" class="text-blue-900 font-semibold hover:underline">login</a>
            </p>
        </div>
    </div>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        if (!token) {
            showNotification('Missing or invalid reset token.', 'error');
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('rp-password').value;
            const p2 = document.getElementById('rp-confirm').value;
            if (p1 !== p2) {
                showNotification('Passwords do not match', 'error');
                return;
            }
            try {
                await resetPassword(token, p1);
                showNotification('Password reset successful. You can now log in.', 'success');
                setTimeout(() => window.location.href = './login.html', 1500);
            } catch (err) {
                showNotification(err.message || 'Reset failed', 'error');
            }
        });
    </script>
</body>
</html>
