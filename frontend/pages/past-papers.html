<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Papers - Elite Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a5f">
    <link rel="icon" type="image/png" href="../Favicon.png">
</head>
<body class="bg-gray-50">
    <div id="main-nav"></div>

    <section class="bg-gradient-to-r from-blue-900 to-green-700 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl font-bold">📃 KNEC Past Papers</h1>
            <p class="text-lg text-gray-100 mt-2">Download official KCSE and KCPE past examination papers</p>
        </div>
    </section>

    <!-- Filters -->
    <section class="bg-white border-b py-4 sticky top-0 z-20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap gap-3 items-center">
            <select id="filter-exam" onchange="applyFilters()"
                    class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Exam Bodies</option>
                <option value="KCSE">KCSE</option>
                <option value="KCPE">KCPE</option>
            </select>
            <select id="filter-subject" onchange="applyFilters()"
                    class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Subjects</option>
            </select>
            <select id="filter-year" onchange="applyFilters()"
                    class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Years</option>
            </select>
            <select id="filter-paper" onchange="applyFilters()"
                    class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Papers</option>
                <option value="Paper 1">Paper 1</option>
                <option value="Paper 2">Paper 2</option>
                <option value="Paper 3">Paper 3</option>
            </select>
            <span id="result-count" class="text-sm text-gray-500 ml-auto"></span>
        </div>
    </section>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div id="papers-container">
            <!-- Skeleton -->
            <div id="skeleton" class="space-y-8">
                <div class="animate-pulse"><div class="h-6 bg-gray-200 rounded w-48 mb-4"></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div class="h-32 bg-gray-200 rounded-xl"></div>
                        <div class="h-32 bg-gray-200 rounded-xl"></div>
                        <div class="h-32 bg-gray-200 rounded-xl"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="empty-state" class="hidden text-center py-16 text-gray-400">
            <div class="text-5xl mb-4">📭</div>
            <p class="text-lg font-semibold">No past papers found</p>
            <p class="text-sm mt-1">Try adjusting your filters</p>
        </div>
    </div>

    <div id="main-footer"></div>

    <script src="../assets/js/api.js"></script>
    <script src="./assets/js/components.js"></script>
    <script>
        initPage('student', 'past-papers');

        const BASE = () => (typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : '/api');
        let allPapers = [];

        async function loadPapers() {
            try {
                const res  = await fetch(`${BASE()}/resources?type=past-paper`);
                if (!res.ok) throw new Error('Failed to load');
                const data = await res.json();
                allPapers  = Array.isArray(data) ? data : (data.resources || []);
                populateFilterOptions();
                applyFilters();
            } catch (err) {
                document.getElementById('skeleton').innerHTML =
                    `<div class="text-center py-10 text-red-500">${err.message}<br><button class="mt-3 bg-blue-900 text-white px-4 py-2 rounded" onclick="loadPapers()">Retry</button></div>`;
            }
        }

        function populateFilterOptions() {
            const subjects = [...new Set(allPapers.map(p => p.subject).filter(Boolean))].sort();
            const years    = [...new Set(allPapers.map(p => p.year).filter(Boolean))].sort((a,b) => b - a);
            const subjSel  = document.getElementById('filter-subject');
            const yearSel  = document.getElementById('filter-year');
            subjects.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; subjSel.appendChild(o); });
            years.forEach(y   => { const o = document.createElement('option'); o.value = y; o.textContent = y; yearSel.appendChild(o); });
        }

        function applyFilters() {
            const exam    = document.getElementById('filter-exam').value;
            const subject = document.getElementById('filter-subject').value;
            const year    = document.getElementById('filter-year').value;
            const paper   = document.getElementById('filter-paper').value;

            const filtered = allPapers.filter(p =>
                (!exam    || p.examBody     === exam) &&
                (!subject || p.subject      === subject) &&
                (!year    || String(p.year) === String(year)) &&
                (!paper   || p.paperNumber  === paper)
            );

            document.getElementById('result-count').textContent = `${filtered.length} paper${filtered.length !== 1 ? 's' : ''} found`;
            renderGrouped(filtered);
        }

        function renderGrouped(papers) {
            const container = document.getElementById('papers-container');
            const empty     = document.getElementById('empty-state');
            document.getElementById('skeleton').remove?.();

            if (!papers.length) {
                container.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            // Group by subject
            const bySubject = {};
            papers.forEach(p => {
                const subj = p.subject || 'General';
                if (!bySubject[subj]) bySubject[subj] = [];
                bySubject[subj].push(p);
            });

            container.innerHTML = Object.keys(bySubject).sort().map(subj => {
                // Sort by year descending within subject
                const sorted = bySubject[subj].sort((a,b) => (b.year||0) - (a.year||0));
                return `
                    <div class="mb-10">
                        <h2 class="text-xl font-bold text-blue-900 mb-4 flex items-center gap-2">
                            📚 ${subj}
                            <span class="text-sm font-normal text-gray-400">(${sorted.length} paper${sorted.length !== 1 ? 's' : ''})</span>
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                            ${sorted.map(paperCard).join('')}
                        </div>
                    </div>`;
            }).join('');
        }

        function paperCard(p) {
            const examBadge = p.examBody
                ? `<span class="text-xs font-bold px-2 py-0.5 rounded-full ${p.examBody === 'KCSE' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'}">${p.examBody}</span>`
                : '';
            const dlBtn = p.fileUrl
                ? `<button onclick="handleDownload('${p._id}','${encodeURI(p.fileUrl)}')"
                           class="flex-1 bg-blue-900 text-white text-xs py-2 rounded-lg hover:bg-blue-800 transition font-semibold">
                       ⬇ Download
                   </button>`
                : `<span class="flex-1 text-center text-xs text-gray-400 py-2">No file</span>`;
            const msBtn = p.hasMarkingScheme && p.markingSchemeUrl
                ? `<button onclick="window.open('${encodeURI(p.markingSchemeUrl)}','_blank')"
                           class="flex-1 bg-green-600 text-white text-xs py-2 rounded-lg hover:bg-green-700 transition font-semibold">
                       ✅ Marking Scheme
                   </button>`
                : (p.hasMarkingScheme ? `<span class="flex-1 text-center text-xs text-green-600 py-2 font-semibold">MS Available</span>` : '');

            return `
                <div class="bg-white rounded-xl shadow hover:shadow-md transition p-4 flex flex-col gap-2">
                    <div class="flex items-center justify-between">
                        <span class="text-2xl font-bold text-blue-900">${p.year || '—'}</span>
                        ${examBadge}
                    </div>
                    <p class="text-sm font-semibold text-gray-700">${p.paperNumber || 'Paper'}</p>
                    ${p.title ? `<p class="text-xs text-gray-500">${p.title}</p>` : ''}
                    <div class="flex gap-2 mt-auto pt-2">
                        ${dlBtn}
                        ${msBtn}
                    </div>
                </div>`;
        }

        async function handleDownload(id, url) {
            try {
                await downloadResource(id);
                window.open(decodeURI(url), '_blank');
            } catch (err) {
                if (err.message === 'auth_required') { window.location.href = './login.html'; return; }
                // Still open even if count fails
                window.open(decodeURI(url), '_blank');
            }
        }

        document.addEventListener('DOMContentLoaded', loadPapers);
    </script>
    <script src="../assets/js/pwa-register.js"></script>
</body>
</html>
