<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Elite Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../Favicon.png">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md bg-white shadow-xl rounded-xl p-8">
            <h1 class="text-3xl font-bold text-center text-blue-900 mb-2">Reset your password</h1>
            <p class="text-center text-gray-600 mb-6">Enter your email and we'll send you a reset link.</p>
            <form id="forgotForm" class="space-y-4">
                <div class="floating-field">
                    <label for="fp-email">Email address</label>
                    <input id="fp-email" type="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg" placeholder=" ">
                </div>
                <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3 rounded-lg hover:bg-blue-800 transition">Send reset link</button>
            </form>
            <p class="text-center text-gray-600 mt-6 text-sm">
                Remembered? <a href="./login.html" class="text-blue-900 font-semibold hover:underline">Back to login</a>
            </p>
        </div>
    </div>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('fp-email').value;
            try {
                const res = await requestPasswordReset(email);
                showNotification(res.message || 'If the account exists, a reset link was sent.', 'success');
            } catch (err) {
                showNotification(err.message || 'Failed to send reset link', 'error');
            }
        });
    </script>
</body>
</html>
