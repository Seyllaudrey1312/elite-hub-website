<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes & Assignments - Elite Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../Favicon.png">
</head>
<body class="bg-gray-50">
    <div id="main-nav"></div>

    <section class="bg-gradient-to-r from-blue-900 to-green-700 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl font-bold">Quizzes &amp; Assignments</h1>
            <p class="text-lg text-gray-100 mt-2">Practice and test your knowledge</p>
        </div>
    </section>

    <!-- Curriculum Toggle + Tabs -->
    <section class="bg-white border-b sticky top-0 z-20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center gap-3 flex-wrap">
            <!-- Curriculum -->
            <div class="flex rounded-lg overflow-hidden border border-gray-300">
                <button id="curr-cbc" onclick="setCurriculum('CBC')"
                        class="px-4 py-2 text-sm font-bold bg-blue-900 text-white transition">CBC</button>
                <button id="curr-844" onclick="setCurriculum('8-4-4')"
                        class="px-4 py-2 text-sm font-bold bg-white text-gray-600 hover:bg-gray-50 transition">8-4-4</button>
            </div>
            <!-- Strand filter (CBC only) -->
            <select id="strandFilter" onchange="applyQuizFilters()"
                    class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none hidden">
                <option value="">All Strands</option>
            </select>
            <!-- Tabs -->
            <button id="quizzesTab"     onclick="showQuizzes()"     class="px-5 py-2 border-b-2 border-blue-900 text-blue-900 font-bold text-sm">Quizzes</button>
            <button id="assignmentsTab" onclick="showAssignments()" class="px-5 py-2 border-b-2 border-transparent text-gray-500 hover:text-blue-900 text-sm">Assignments</button>
            <div class="flex-1"></div>
            <input id="quizSearch" type="text" placeholder="Search quizzes..."
                   class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 w-40">
            <select id="quizSubjectFilter" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                <option value="All">All Subjects</option>
            </select>
            <select id="quizFormFilter" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                <option value="All">All Forms</option>
            </select>
        </div>
    </section>

    <!-- Quizzes -->
    <section id="quizzes-section" class="py-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="quizzesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="quizzesEmpty" class="hidden text-center py-10 text-gray-500"></div>
            <div id="quizzesError" class="hidden text-center py-10 text-red-600"></div>
        </div>
    </section>

    <!-- Assignments -->
    <section id="assignments-section" class="py-10 hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="assignmentsList" class="space-y-6"></div>
            <div id="assignmentsEmpty" class="hidden text-center py-10 text-gray-500"></div>
            <div id="assignmentsError" class="hidden text-center py-10 text-red-600"></div>
        </div>
    </section>

    <!-- Assignment Submission Modal -->
    <div id="assignmentModal" class="cs-modal-backdrop hidden">
        <div class="cs-modal max-w-xl w-full">
            <span class="cs-emoji">📤</span>
            <h3 id="assignmentModalTitle">Submit Assignment</h3>
            <input type="file" id="assignmentFile" accept=".pdf,.doc,.docx,image/*" class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-3">
            <textarea id="assignmentComments" rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-2" placeholder="Add comments (optional)"></textarea>
            <p id="commentCount" class="text-xs text-gray-500 mb-2 text-left">0 / 500</p>
            <button id="assignmentSubmitBtn" class="btn-primary">Submit</button>
            <button class="btn-close" id="assignmentCloseBtn">Cancel</button>
        </div>
    </div>

    <div id="main-footer"></div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/pwa-register.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>initPage('student', 'quizzes');</script>
    <script>
        let allQuizzes = [], myResults = [], allAssignments = [], currentAssignmentId = null;

        const storedStudent = (() => { try { return JSON.parse(localStorage.getItem('student')); } catch { return null; } })();
        let activeCurriculum = storedStudent?.curriculum || 'CBC';

        document.addEventListener('DOMContentLoaded', () => {
            applyCurriculumUI();
            bindFilters();
            bindAssignmentModal();
            fetchQuizzes();
            fetchAssignments();
            if (window.location.hash === '#assignments') showAssignments();
        });

        // ── Curriculum ────────────────────────────────────────────────────────
        function setCurriculum(c) {
            activeCurriculum = c;
            applyCurriculumUI();
            applyQuizFilters();
        }

        function applyCurriculumUI() {
            const cbcBtn = document.getElementById('curr-cbc');
            const btn844 = document.getElementById('curr-844');
            const strandSel = document.getElementById('strandFilter');
            if (activeCurriculum === 'CBC') {
                cbcBtn.classList.add('bg-blue-900','text-white'); cbcBtn.classList.remove('bg-white','text-gray-600');
                btn844.classList.add('bg-white','text-gray-600'); btn844.classList.remove('bg-blue-900','text-white');
                strandSel.classList.remove('hidden');
            } else {
                btn844.classList.add('bg-blue-900','text-white'); btn844.classList.remove('bg-white','text-gray-600');
                cbcBtn.classList.add('bg-white','text-gray-600'); cbcBtn.classList.remove('bg-blue-900','text-white');
                strandSel.classList.add('hidden');
            }
        }

        function populateStrandFilter(quizzes) {
            const sel = document.getElementById('strandFilter');
            const strands = [...new Set(quizzes.filter(q => q.cbcStrand).map(q => q.cbcStrand))].sort();
            const current = sel.value;
            sel.innerHTML = '<option value="">All Strands</option>' +
                strands.map(s => `<option value="${s}" ${s === current ? 'selected' : ''}>${s}</option>`).join('');
        }

        // ── Tabs ──────────────────────────────────────────────────────────────
        function showQuizzes() {
            document.getElementById('quizzes-section').classList.remove('hidden');
            document.getElementById('assignments-section').classList.add('hidden');
            document.getElementById('quizzesTab').classList.add('border-blue-900','text-blue-900','font-bold');
            document.getElementById('assignmentsTab').classList.remove('border-blue-900','text-blue-900','font-bold');
        }
        function showAssignments() {
            document.getElementById('assignments-section').classList.remove('hidden');
            document.getElementById('quizzes-section').classList.add('hidden');
            document.getElementById('assignmentsTab').classList.add('border-blue-900','text-blue-900','font-bold');
            document.getElementById('quizzesTab').classList.remove('border-blue-900','text-blue-900','font-bold');
        }

        // ── Filters ───────────────────────────────────────────────────────────
        function bindFilters() {
            document.getElementById('quizSearch').addEventListener('input', applyQuizFilters);
            document.getElementById('quizSubjectFilter').addEventListener('change', applyQuizFilters);
            document.getElementById('quizFormFilter').addEventListener('change', applyQuizFilters);
            document.getElementById('strandFilter').addEventListener('change', applyQuizFilters);
        }

        async function fetchQuizzes() {
            renderQuizSkeletons();
            try {
                const quizzes = await getAllQuizzes();
                allQuizzes = Array.isArray(quizzes) ? quizzes : (quizzes.quizzes || []);
                try { myResults = await getQuizResultsForMe(); } catch { myResults = []; }
                populateQuizFilters();
                populateStrandFilter(allQuizzes);
                applyQuizFilters();
            } catch (err) {
                const el = document.getElementById('quizzesError');
                el.innerHTML = `${err.message || 'Failed to load quizzes'}<br><button class="toast-action" onclick="fetchQuizzes()">Retry</button>`;
                el.classList.remove('hidden');
            }
        }

        function renderQuizSkeletons() {
            document.getElementById('quizzesList').innerHTML = Array.from({length:3}).map(()=>`
                <div class="bg-white rounded-lg shadow p-6 animate-pulse">
                    <div class="h-4 bg-gray-200 rounded w-2/3 mb-3"></div>
                    <div class="h-3 bg-gray-200 rounded w-1/3 mb-4"></div>
                    <div class="h-8 bg-gray-200 rounded mt-4"></div>
                </div>`).join('');
        }

        function populateQuizFilters() {
            const subjectSel = document.getElementById('quizSubjectFilter');
            const formSel    = document.getElementById('quizFormFilter');
            [...new Set(allQuizzes.map(q => q.subject).filter(Boolean))].sort().forEach(s => {
                const o = document.createElement('option'); o.value = s; o.textContent = s; subjectSel.appendChild(o);
            });
            [...new Set(allQuizzes.map(q => q.form).filter(Boolean))].sort().forEach(f => {
                const o = document.createElement('option'); o.value = f; o.textContent = f; formSel.appendChild(o);
            });
        }

        function applyQuizFilters() {
            const term   = document.getElementById('quizSearch').value.toLowerCase();
            const subj   = document.getElementById('quizSubjectFilter').value;
            const form   = document.getElementById('quizFormFilter').value;
            const strand = document.getElementById('strandFilter').value;
            const filtered = allQuizzes.filter(q => {
                const currMatch   = q.curriculum === 'both' || !q.curriculum || q.curriculum === activeCurriculum;
                const subjMatch   = subj === 'All' || (q.subject||'').toLowerCase() === subj.toLowerCase();
                const formMatch   = form === 'All' || (q.form||'').toLowerCase() === form.toLowerCase();
                const termMatch   = !term || (q.title||'').toLowerCase().includes(term) || (q.topic||'').toLowerCase().includes(term);
                const strandMatch = !strand || (q.cbcStrand||'') === strand;
                return currMatch && subjMatch && formMatch && termMatch && strandMatch;
            });
            renderQuizzes(filtered);
        }

        function renderQuizzes(list) {
            const container = document.getElementById('quizzesList');
            const emptyEl   = document.getElementById('quizzesEmpty');
            if (!list.length) {
                container.innerHTML = '';
                emptyEl.textContent = 'No quizzes found for the selected filters.';
                emptyEl.classList.remove('hidden');
                return;
            }
            emptyEl.classList.add('hidden');
            container.innerHTML = list.map(renderQuizCard).join('');
        }

        function renderQuizCard(q) {
            const completed  = myResults.find(r => r.quizId === q._id || r.quiz === q._id);
            const statusBadge= completed ? '<span class="badge badge-success">Completed</span>' : '<span class="badge badge-warning">Not Started</span>';
            const isPremium  = !!q.isPremium;
            const cbcBadges  = (q.cbcStrand || q.cbcSubStrand) ? `
                <div class="flex flex-wrap gap-1 mt-1 mb-2">
                    ${q.cbcStrand    ? `<span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded-full">📌 ${q.cbcStrand}</span>` : ''}
                    ${q.cbcSubStrand ? `<span class="bg-gray-100 text-gray-500 text-xs px-2 py-0.5 rounded-full">↳ ${q.cbcSubStrand}</span>` : ''}
                </div>` : '';
            const button = isPremium
                ? `<button class="bg-blue-900 text-white px-4 py-2 rounded flex items-center gap-2" data-pro="true">🔒 Pro</button>`
                : `<button class="bg-blue-900 text-white px-4 py-2 rounded hover:bg-blue-800 transition text-sm" onclick="window.location.href='take-quiz.html?id=${q._id}'">${completed ? 'Retake Quiz' : 'Start Quiz'}</button>`;
            return `
                <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition">
                    <div class="flex items-start justify-between mb-2">
                        <h3 class="text-base font-bold text-blue-900">${q.title || 'Untitled Quiz'}</h3>
                        <span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full ml-2 whitespace-nowrap">${q.form || 'All'}</span>
                    </div>
                    <div class="flex flex-wrap gap-1 text-xs mb-1">
                        <span class="badge badge-primary">${q.subject || 'Subject'}</span>
                        <span class="badge badge-warning">${q.topic || 'Topic'}</span>
                        ${q.curriculum && q.curriculum !== 'both' ? `<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-semibold">${q.curriculum}</span>` : ''}
                    </div>
                    ${cbcBadges}
                    <p class="text-sm text-gray-600 mb-1">Questions: ${q.questions?.length || q.questionCount || 0}</p>
                    <p class="text-sm text-gray-600 mb-2">Time: ${q.timeLimit || 0} mins</p>
                    ${statusBadge}
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xs text-gray-400">${completed ? 'Completed' : 'Ready'}</span>
                        ${button}
                    </div>
                </div>`;
        }

        // ── Assignments ───────────────────────────────────────────────────────
        async function fetchAssignments() {
            try {
                const data = await getAllAssignments();
                allAssignments = Array.isArray(data) ? data : (data.assignments || []);
                if (!allAssignments.length) {
                    document.getElementById('assignmentsEmpty').textContent = 'No assignments yet.';
                    document.getElementById('assignmentsEmpty').classList.remove('hidden');
                    return;
                }
                renderAssignments(allAssignments);
            } catch (err) {
                document.getElementById('assignmentsError').innerHTML = `${err.message || 'Failed'}<br><button class="toast-action" onclick="fetchAssignments()">Retry</button>`;
                document.getElementById('assignmentsError').classList.remove('hidden');
            }
        }

        function renderAssignments(list) {
            document.getElementById('assignmentsList').innerHTML = list.map(a => {
                const dueDate  = a.dueDate ? new Date(a.dueDate) : null;
                const daysLeft = dueDate ? Math.ceil((dueDate - new Date()) / 86400000) : null;
                const badge    = daysLeft === null ? '<span class="badge badge-warning">No due date</span>'
                    : daysLeft < 0 ? '<span class="badge badge-danger">Overdue</span>'
                    : daysLeft < 3 ? `<span class="badge badge-danger">${daysLeft}d left</span>`
                    : `<span class="badge badge-success">${daysLeft}d left</span>`;
                const currBadge = a.curriculum ? `<span class="bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded-full font-semibold">${a.curriculum}</span>` : '';
                return `
                    <div class="bg-white rounded-lg shadow-lg p-6 border-l-4 border-blue-900">
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                <h3 class="text-lg font-bold text-blue-900">${a.title || 'Assignment'}</h3>
                                <div class="flex flex-wrap gap-1 text-xs mt-1">
                                    <span class="badge badge-primary">${a.subject || 'Subject'}</span>
                                    <span class="badge badge-warning">${a.form || 'Form'}</span>
                                    ${currBadge}
                                </div>
                            </div>
                            ${badge}
                        </div>
                        <p class="text-gray-600 text-sm mb-2">${a.description || ''}</p>
                        <p class="text-xs text-gray-400 mb-3">Due: ${dueDate ? dueDate.toDateString() : 'N/A'}</p>
                        <div class="flex justify-end">
                            <button class="bg-blue-900 text-white px-4 py-2 rounded hover:bg-blue-800 transition text-sm"
                                    onclick="openAssignmentModal('${a._id}','${(a.title||'').replace(/'/g,"\\'")}')">Submit</button>
                        </div>
                    </div>`;
            }).join('');
        }

        function bindAssignmentModal() {
            document.getElementById('assignmentCloseBtn').onclick = closeAssignmentModal;
            document.getElementById('assignmentComments').addEventListener('input', e => {
                const v = e.target.value.slice(0,500); e.target.value = v;
                document.getElementById('commentCount').textContent = `${v.length} / 500`;
            });
            document.getElementById('assignmentSubmitBtn').onclick = submitAssignment;
        }

        function openAssignmentModal(id, title) {
            currentAssignmentId = id;
            document.getElementById('assignmentModalTitle').textContent = `Submit: ${title}`;
            document.getElementById('assignmentModal').classList.remove('hidden');
        }
        function closeAssignmentModal() {
            currentAssignmentId = null;
            document.getElementById('assignmentModal').classList.add('hidden');
            document.getElementById('assignmentFile').value = '';
            document.getElementById('assignmentComments').value = '';
            document.getElementById('commentCount').textContent = '0 / 500';
            const btn = document.getElementById('assignmentSubmitBtn');
            btn.disabled = false; btn.textContent = 'Submit';
        }

        async function submitAssignment() {
            if (!currentAssignmentId) return;
            const btn  = document.getElementById('assignmentSubmitBtn');
            const file = document.getElementById('assignmentFile').files[0];
            const comments = document.getElementById('assignmentComments').value;
            if (file && file.size > 10 * 1024 * 1024) { showNotification('File must be under 10MB','error'); return; }
            btn.disabled = true; btn.textContent = 'Uploading...';
            try {
                await submitAssignmentFile(currentAssignmentId, file, comments);
                showNotification('Assignment submitted','success');
                closeAssignmentModal();
            } catch (err) {
                btn.disabled = false; btn.textContent = 'Submit';
                showNotification(err.message || 'Submission failed','error');
            }
        }
    </script>
</body>
</html>
